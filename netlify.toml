# Netlify Configuration for Brahm Shakti Hospital

[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://brahm-shakti-hospital.vercel.app/api"

# Proxy API calls directly to the Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://brahm-shakti-hospital.vercel.app/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
